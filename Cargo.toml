[package]
name = "quickbridge"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Local upload, download, and HTTP proxy helper with a Cloudflare quick tunnel for the Omarchy Quick Bridge plugin."
rust-version = "1.86"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "macros"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cloudflare-quick-tunnel = "0.3"
dirs = "6"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio", "service"] }
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "time", "fs", "sync", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tempfile = "3"
