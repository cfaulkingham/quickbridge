<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'">
  <title>Download from desktop</title>
  <style>
    :root {
      --bg: #111111;
      --fg: #f4f1ea;
      --dim: #9a958a;
      --card: #1c1c1c;
      --line: rgba(244, 241, 234, 0.12);
      --accent: #f4f1ea;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body {
      padding: 28px 20px 48px;
      padding-bottom: max(48px, env(safe-area-inset-bottom));
    }
    main {
      max-width: 28rem;
      margin: 0 auto;
    }
    .kicker {
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--dim);
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.7rem;
      line-height: 1.15;
      margin: 0 0 8px;
      overflow-wrap: anywhere;
    }
    .lede {
      color: var(--dim);
      margin: 0 0 24px;
    }
    .zone {
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 28px 18px;
      text-align: center;
    }
    .preview {
      display: block;
      max-width: 100%;
      max-height: 16rem;
      margin: 0 auto 16px;
      border-radius: 12px;
      text-align: left;
      white-space: pre-wrap;
      overflow: auto;
      font: 13px/1.4 ui-monospace, monospace;
      color: var(--fg);
    }
    img.preview { background: #000; }
    .btn {
      appearance: none;
      display: block;
      width: 100%;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #111;
      font: inherit;
      font-weight: 650;
      padding: 14px 16px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .limit { margin-top: 14px; color: var(--dim); font-size: 0.82rem; text-align: center; }
  </style>
</head>
<body data-auto="{{AUTO}}">
  <main>
    <div class="kicker">Quick Bridge</div>
    <h1>{{NAME}}</h1>
    <p class="lede">{{SIZE_LABEL}} from the desktop. This link only works while the panel is live.</p>
    <div class="zone">
      {{PREVIEW}}
      <a class="btn" id="dl" href="file" download>Download</a>
    </div>
    <p class="limit">If the download does not start, tap the button.</p>
  </main>
  <script>
    if (document.body.dataset.auto === "1") {
      const a = document.getElementById("dl");
      setTimeout(() => { a.click(); }, 80);
    }
  </script>
</body>
</html>
