<!DOCTYPE html>
<html lang="{{HTML_LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #111111;
      --fg: #f4f1ea;
      --dim: #9a958a;
      --card: #1c1c1c;
      --line: rgba(244, 241, 234, 0.12);
      --accent: #f4f1ea;
      --bad: #e07a7a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body {
      padding: 28px 20px 48px;
      padding-bottom: max(48px, env(safe-area-inset-bottom));
    }
    main { max-width: 28rem; margin: 0 auto; }
    .kicker {
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--dim);
      margin-bottom: 8px;
    }
    h1 { font-size: 1.7rem; line-height: 1.15; margin: 0 0 8px; }
    .lede { color: var(--dim); margin: 0 0 24px; }
    .zone {
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 28px 18px;
      text-align: center;
    }
    input {
      appearance: none;
      width: 100%;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.4em;
      text-align: center;
      padding: 14px 16px;
      border-radius: 12px;
    }
    button {
      appearance: none;
      display: block;
      width: 100%;
      margin-top: 12px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #111;
      font: inherit;
      font-weight: 650;
      padding: 14px 16px;
      border-radius: 12px;
    }
    .bad { color: var(--bad); margin: 0 0 14px; }
    .limit { margin-top: 14px; color: var(--dim); font-size: 0.82rem; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="kicker">Quick Bridge</div>
    <h1>{{H1}}</h1>
    <p class="lede">{{LEDE}}</p>
    <div class="zone">
      {{ERROR}}
      <form method="post" action="{{UNLOCK_ACTION}}">
        <input type="hidden" name="next" value="{{NEXT}}">
        <input name="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" minlength="6" autocomplete="one-time-code" required autofocus>
        <button type="submit">{{UNLOCK}}</button>
      </form>
    </div>
    <p class="limit">{{LIMIT}}</p>
  </main>
</body>
</html>
